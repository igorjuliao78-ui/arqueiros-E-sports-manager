plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'org.jetbrains.kotlin.plugin.compose' }
android {
 namespace 'br.com.arqueiros.manager'
 compileSdk 35
 defaultConfig { applicationId 'br.com.arqueiros.manager'; minSdk 26; targetSdk 35; versionCode 2; versionName '2.0-native' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
}
dependencies {
 implementation platform('androidx.compose:compose-bom:2024.10.00')
 implementation 'androidx.activity:activity-compose:1.10.0'
 implementation 'androidx.compose.ui:ui'
 implementation 'androidx.compose.ui:ui-tooling-preview'
 implementation 'androidx.compose.material3:material3'
 implementation 'androidx.compose.material:material-icons-extended'
 implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
 implementation 'com.squareup.okhttp3:okhttp:4.12.0'
 implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
 implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
}
 
// Gera o ícone do launcher a partir da arte oficial já versionada no projeto.
def launcherResDir = layout.buildDirectory.dir("generated/launcherRes")
tasks.register("generateLauncherIcon") {
    inputs.file("src/main/assets/arqueiros-logo.jpg.b64")
    outputs.file(launcherResDir.map { it.file("drawable/ic_launcher.jpg") })
    doLast {
        def iconFile = launcherResDir.get().file("drawable/ic_launcher.jpg").asFile
        iconFile.parentFile.mkdirs()
        def encoded = file("src/main/assets/arqueiros-logo.jpg.b64").text.replaceAll("\\s", "")
        iconFile.bytes = java.util.Base64.getDecoder().decode(encoded)
    }
}
android.sourceSets.main.res.srcDir(launcherResDir)
tasks.named("preBuild").configure { dependsOn("generateLauncherIcon") }
