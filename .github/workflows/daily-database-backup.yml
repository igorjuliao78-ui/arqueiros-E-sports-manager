name: Daily Arqueiros PostgreSQL Backup

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Create encrypted-by-transport database dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Missing GitHub Actions secret DATABASE_URL (Render External Database URL)."
            exit 1
          fi
          pg_dump "$DATABASE_URL" --no-owner --no-acl --format=custom --file=arqueiros-backup.dump
      - name: Store backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: arqueiros-postgresql-backup-${{ github.run_id }}
          path: arqueiros-backup.dump
          retention-days: 30
